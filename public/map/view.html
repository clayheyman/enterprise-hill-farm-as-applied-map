<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>As-applied map — Enterprise Hill Farm Aerial</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  .print-header { display: none; }
  @media print {
    .print-header { display: block; text-align: center; margin-bottom: 16px; }
    #map { height: 380px !important; }
  }
</style>
</head>
<body>
  <div class="topbar no-print">
    <div class="brand"><span class="badge">EHF</span> Enterprise Hill Farm Aerial</div>
    <nav>
      <a href="tel:4199218999">419-921-8999</a>
      <a href="mailto:enterprisehillfarm@gmail.com">enterprisehillfarm@gmail.com</a>
    </nav>
  </div>

  <div class="page" id="pageRoot">
    <div class="print-header">
      <h1>Enterprise Hill Farm Aerial — As-Applied Map</h1>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
        <div>
          <h1 id="jobTitleHeading">Loading…</h1>
          <p class="subtitle" id="jobSubline"></p>
        </div>
        <button class="btn gold no-print" id="downloadPdfBtn">Download PDF</button>
      </div>
      <div class="stat-row" id="overallStats"></div>
    </div>

    <div class="card">
      <h2>Coverage map</h2>
      <div id="map"></div>
      <div id="legend" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:14px;"></div>
    </div>

    <div class="card">
      <h2>Field-by-field summary</h2>
      <table>
        <thead>
          <tr><th>Field</th><th>Acres</th><th>Product applied</th><th>Rate/acre</th><th>Passes</th></tr>
        </thead>
        <tbody id="fieldTableBody"></tbody>
        <tfoot>
          <tr class="total-row">
            <td>Total</td>
            <td id="totalAcres"></td>
            <td id="totalAmount"></td>
            <td id="totalRate"></td>
            <td id="totalPasses"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <p class="hint no-print" style="text-align:center;">Prepared by Enterprise Hill Farm Aerial · Norwalk, Ohio</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/map-view.js"></script>
</body>
</html>
